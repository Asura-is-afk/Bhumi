<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bhumi's Cuteness Run 3D</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0b071a; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    
    #ui {
      position: absolute; top: 15px; left: 15px; color: #fff;
      font-weight: bold; font-size: 18px; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none; z-index: 10;
    }
    .badge { background: rgba(255, 105, 180, 0.3); border: 1px solid #ff69b4; padding: 4px 10px; border-radius: 12px; margin-bottom: 5px; inline-size: fit-content; }
    .heart-count { color: #ff3366; font-size: 24px; }
    .star-status { color: #ffd700; font-size: 16px; display: none; margin-top: 5px; }

    #controls {
      position: absolute; bottom: 25px; width: 100%; display: flex;
      justify-content: space-around; z-index: 10; padding: 0 20px;
    }
    .btn {
      background: rgba(255, 105, 180, 0.4); border: 2px solid rgba(255, 255, 255, 0.8);
      color: white; font-size: 26px; font-weight: bold; width: 75px; height: 75px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
    }
    .btn:active { background: rgba(255, 20, 147, 0.8); transform: scale(0.92); }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 7, 26, 0.85); color: white; display: flex;
      flex-direction: column; align-items: center; justify-content: center; z-index: 20;
      backdrop-filter: blur(6px);
    }
    #overlay h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: #ff69b4; text-shadow: 0 0 15px #ff69b4; }
    #overlay p { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 20px; text-align: center; max-width: 80%; }
    #start-btn {
      padding: 14px 32px; font-size: 20px; font-weight: bold; background: linear-gradient(45deg, #ff3366, #ff69b4);
      color: white; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.6); transition: transform 0.2s;
    }
    #start-btn:active { transform: scale(0.95); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
  <div class="badge">Player: <span style="color:#ffb6c1;">Bhumi</span></div>
  <div>Cuteness Level: <span id="cuteness" class="heart-count">0%</span></div>
  <div>Hearts Collected: <span id="hearts">0</span> ❤️</div>
  <div id="star-status" class="star-status">⭐ STAR POWER ACTIVE! ⭐</div>
</div>

<div id="controls">
  <div class="btn" id="btn-left">◀</div>
  <div class="btn" id="btn-jump">▲</div>
  <div class="btn" id="btn-right">▶</div>
</div>

<div id="overlay">
  <h1 id="title">Bhumi's Cuteness Run 3D</h1>
  <p id="description">Collect floating hearts, dodge barriers, and grab Golden Stars for Invincibility Power!</p>
  <button id="start-btn" onclick="startGame()">Tap to Play</button>
</div>

<script>
  // Web Audio Synthesizer (No external sound files required)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'heart') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'jump') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'star') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(880, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.3);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  }

  // Game Engine Variables
  let scene, camera, renderer;
  let player, leftLeg, rightLeg, leftArm, rightArm;
  let currentLane = 0;
  const lanes = [-2.5, 0, 2.5];

  let isJumping = false, jumpVelocity = 0;
  const gravity = -0.016;

  let itemsList = [], obstaclesList = [];
  let speed = 0.28, heartsCollected = 0, cutenessPercent = 0;
  let isGameOver = false, isGameStarted = false;
  let isInvincible = false, invincibilityTimer = 0;
  let animClock = 0;

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b071a);
    scene.fog = new THREE.FogExp2(0x0b071a, 0.025);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.8, 7.5);
    camera.lookAt(0, 1.2, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffb6c1, 1.0);
    dirLight.position.set(5, 12, 8);
    scene.add(dirLight);

    // Synthwave Track Base
    const trackGeo = new THREE.BoxGeometry(8, 0.2, 300);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x16102e, roughness: 0.3 });
    const track = new THREE.Mesh(trackGeo, trackMat);
    track.position.z = -130;
    scene.add(track);

    // Glowing Neon Side Rails
    const railGeo = new THREE.BoxGeometry(0.2, 0.4, 300);
    const railMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
    const leftRail = new THREE.Mesh(railGeo, railMat); leftRail.position.set(-4.1, 0.2, -130);
    const rightRail = new THREE.Mesh(railGeo, railMat); rightRail.position.set(4.1, 0.2, -130);
    scene.add(leftRail); scene.add(rightRail);

    // Particle Stars in Sky
    const particleGeo = new THREE.BufferGeometry();
    const particleCoords = [];
    for(let i=0; i<300; i++) {
      particleCoords.push((Math.random()-0.5)*80, Math.random()*30 + 2, (Math.random()-0.5)*200);
    }
    particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(particleCoords, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0xffb6c1, size: 0.3 });
    scene.add(new THREE.Points(particleGeo, particleMat));

    buildPlayerModel();

    // Event Listeners
    document.addEventListener('keydown', handleKeyDown);
    document.getElementById('btn-left').addEventListener('click', () => movePlayer(-1));
    document.getElementById('btn-right').addEventListener('click', () => movePlayer(1));
    document.getElementById('btn-jump').addEventListener('click', jump);
    window.addEventListener('resize', onWindowResize);

    spawnInitialMap();
  }

  function buildPlayerModel() {
    player = new THREE.Group();

    // Dress / Body
    const dressMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
    const dress = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.5, 0.9, 16), dressMat);
    dress.position.y = 0.75;
    player.add(dress);

    // Head & Skin
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), skinMat);
    head.position.y = 1.45;
    player.add(head);

    // Hair
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11 });
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16), hairMat);
    hair.position.set(0, 1.5, -0.05);
    player.add(hair);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6);
    leftLeg = new THREE.Mesh(legGeo, skinMat); leftLeg.position.set(-0.18, 0.3, 0);
    rightLeg = new THREE.Mesh(legGeo, skinMat); rightLeg.position.set(0.18, 0.3, 0);
    player.add(leftLeg); player.add(rightLeg);

    // Arms
    const armGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.5);
    leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.35, 1.0, 0);
    rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.35, 1.0, 0);
    player.add(leftArm); player.add(rightArm);

    scene.add(player);
  }

  // Procedural Geometries for Collectibles & Obstacles
  function createHeartGeometry() {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(0, 0.3, -0.5, 0.6, -0.5, 1);
    shape.bezierCurveTo(-0.5, 1.4, 0, 1.6, 0, 1.2);
    shape.bezierCurveTo(0, 1.6, 0.5, 1.4, 0.5, 1);
    shape.bezierCurveTo(0.5, 0.6, 0, 0.3, 0, 0);
    return new THREE.ExtrudeGeometry(shape, { depth: 0.1, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 });
  }

  const heartGeo = createHeartGeometry();
  const heartMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2, metalness: 0.2, emissive: 0xaa0033 });
  const starGeo = new THREE.OctahedronGeometry(0.5, 0);
  const starMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, roughness: 0.1 });
  const barrierGeo = new THREE.BoxGeometry(1.8, 0.9, 0.6);
  const barrierMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });

  function spawnInitialMap() {
    for (let z = -12; z > -200; z -= 14) {
      const lane = lanes[Math.floor(Math.random() * 3)];
      const rand = Math.random();

      if (rand < 0.55) {
        // Spawn Heart
        const heart = new THREE.Mesh(heartGeo, heartMat);
        heart.scale.set(0.38, 0.38, 0.38); heart.rotation.x = Math.PI;
        heart.position.set(lane, 0.9, z);
        heart.userData = { type: 'heart' };
        scene.add(heart); itemsList.push(heart);
      } else if (rand < 0.68) {
        // Spawn Golden Star
        const star = new THREE.Mesh(starGeo, starMat);
        star.position.set(lane, 1.0, z);
        star.userData = { type: 'star' };
        scene.add(star); itemsList.push(star);
      } else {
        // Spawn Barrier
        const barrier = new THREE.Mesh(barrierGeo, barrierMat);
        barrier.position.set(lane, 0.45, z);
        scene.add(barrier); obstaclesList.push(barrier);
      }
    }
  }

  function movePlayer(dir) {
    if (!isGameStarted || isGameOver) return;
    currentLane = Math.max(-1, Math.min(1, currentLane + dir));
  }

  function jump() {
    if (!isJumping && isGameStarted && !isGameOver) {
      isJumping = true; jumpVelocity = 0.28;
      playSound('jump');
    }
  }

  function handleKeyDown(e) {
    if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1);
    if (e.key === "ArrowRight" || e.key === "d") movePlayer(1);
    if (e.key === "ArrowUp" || e.key === " " || e.key === "w") jump();
  }

  function animate() {
    if (!isGameStarted || isGameOver) return;
    requestAnimationFrame(animate);

    animClock += 0.15;

    // Smooth Lane Shift
    player.position.x += (lanes[currentLane + 1] - player.position.x) * 0.22;

    // Jump Physics
    if (isJumping) {
      player.position.y += jumpVelocity;
      jumpVelocity += gravity;
      if (player.position.y <= 0) {
        player.position.y = 0; isJumping = false;
      }
    } else {
      // Running Animation
      leftLeg.rotation.x = Math.sin(animClock) * 0.6;
      rightLeg.rotation.x = -Math.sin(animClock) * 0.6;
      leftArm.rotation.x = -Math.sin(animClock) * 0.6;
      rightArm.rotation.x = Math.sin(animClock) * 0.6;
    }

    // Invincibility Timer
    if (isInvincible) {
      invincibilityTimer -= 0.016;
      player.rotation.y += 0.2; // Spin effect
      if (invincibilityTimer <= 0) {
        isInvincible = false;
        player.rotation.y = 0;
        document.getElementById('star-status').style.display = 'none';
      }
    }

    // Animate and Move Collectibles
    for (let i = itemsList.length - 1; i >= 0; i--) {
      let item = itemsList[i];
      item.position.z += speed;
      item.rotation.y += 0.04;

      if (Math.abs(item.position.z - player.position.z) < 0.8 &&
          Math.abs(item.position.x - player.position.x) < 0.8 &&
          player.position.y < 1.6) {
        
        if (item.userData.type === 'heart') {
          playSound('heart');
          heartsCollected++; cutenessPercent += 5;
          document.getElementById('hearts').innerText = heartsCollected;
          document.getElementById('cuteness').innerText = cutenessPercent + "%";
        } else if (item.userData.type === 'star') {
          playSound('star');
          isInvincible = true; invincibilityTimer = 5; // 5 seconds star power
          document.getElementById('star-status').style.display = 'block';
        }

        scene.remove(item); itemsList.splice(i, 1);
      } else if (item.position.z > 5) {
        scene.remove(item); itemsList.splice(i, 1);
      }
    }

    // Move Obstacles & Collision Check
    for (let i = obstaclesList.length - 1; i >= 0; i--) {
      let obs = obstaclesList[i];
      obs.position.z += speed;

      if (Math.abs(obs.position.z - player.position.z) < 0.8 &&
          Math.abs(obs.position.x - player.position.x) < 0.8 &&
          player.position.y < 0.85) {
        
        if (isInvincible) {
          // Smash through barrier!
          scene.remove(obs); obstaclesList.splice(i, 1);
          playSound('heart');
        } else {
          playSound('hit');
          triggerGameOver();
        }
      } else if (obs.position.z > 5) {
        scene.remove(obs); obstaclesList.splice(i, 1);
      }
    }

    // Replenish track items continuously
    if (itemsList.length + obstaclesList.length < 14) {
      spawnInitialMap();
    }

    speed += 0.00003; // Slowly speed up
    renderer.render(scene, camera);
  }

  function startGame() {
    document.getElementById('overlay').style.display = 'none';
    if (!isGameStarted) {
      isGameStarted = true;
      animate();
    } else {
      location.reload();
    }
  }

  function triggerGameOver() {
    isGameOver = true;
    document.getElementById('title').innerText = "Game Over!";
    document.getElementById('description').innerText = `Bhumi collected ${heartsCollected} Hearts with a Cuteness Level of ${cutenessPercent}%!`;
    document.getElementById('start-btn').innerText = "Play Again";
    document.getElementById('overlay').style.display = 'flex';
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.onload = initScene;
</script>
</body>
</html>
